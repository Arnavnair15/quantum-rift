<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Rift // Tactical Space Survival</title>
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & SCI-FI COLOR PALETTE
       ========================================================================== */
    :root {
      --bg-void: #03050c;
      --bg-surface: rgba(10, 15, 30, 0.88);
      --bg-surface-elevated: rgba(16, 24, 48, 0.75);
      --bg-card: rgba(18, 28, 58, 0.55);
      
      --neon-cyan: #00f0ff;
      --neon-cyan-dim: rgba(0, 240, 255, 0.25);
      --neon-cyan-glow: rgba(0, 240, 255, 0.45);
      
      --neon-violet: #8b5cf6;
      --neon-violet-dim: rgba(139, 92, 246, 0.25);
      --neon-violet-glow: rgba(139, 92, 246, 0.4);
      
      --neon-gold: #fbbf24;
      --neon-gold-glow: rgba(251, 191, 36, 0.45);
      
      --status-emerald: #10b981;
      --status-emerald-glow: rgba(16, 185, 129, 0.45);
      --status-amber: #f59e0b;
      --status-amber-glow: rgba(245, 158, 11, 0.45);
      --status-crimson: #f43f5e;
      --status-crimson-glow: rgba(244, 63, 94, 0.55);
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hud: rgba(0, 240, 255, 0.28);
      
      --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'Consolas', 'Courier New', monospace;
      --transition-fast: 0.18s ease;
      --transition-normal: 0.28s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-void);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.14) 0%, transparent 60%),
        radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, #03050c 0%, #060914 100%);
      color: var(--text-primary);
      font-family: var(--font-display);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 1rem;
      overflow-x: hidden;
    }

    /* ==========================================================================
       2. APPLICATION SHELL & RESPONSIVE CONTAINER
       ========================================================================== */
    .game-shell {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
    }

    /* ==========================================================================
       3. TACTICAL HEADER & CONTROLS STRIP
       ========================================================================== */
    .tactical-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 0.85rem 1.25rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-hud);
      border-radius: 8px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 240, 255, 0.04);
    }

    .brand-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title {
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 15%, var(--neon-cyan) 65%, var(--neon-violet) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px var(--neon-cyan-glow));
      line-height: 1.1;
    }

    .brand-protocol {
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--neon-violet);
      font-family: var(--font-mono);
      font-weight: 600;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    /* Accessible Mute/Unmute Button */
    .sound-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 0.4rem 0.85rem;
      border-radius: 50px;
      border: 1px solid rgba(0, 240, 255, 0.35);
      background: rgba(0, 240, 255, 0.1);
      color: var(--neon-cyan);
      cursor: pointer;
      transition: all var(--transition-fast);
      outline: none;
    }

    .sound-toggle-btn:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: #ffffff;
      box-shadow: 0 0 12px var(--neon-cyan-glow);
    }

    .sound-toggle-btn:focus-visible {
      outline: 2px solid var(--neon-cyan);
      outline-offset: 3px;
    }

    .sound-toggle-btn.muted {
      background: rgba(148, 163, 184, 0.1);
      border-color: rgba(148, 163, 184, 0.3);
      color: var(--text-muted);
    }

    .sound-toggle-btn.muted:hover {
      border-color: var(--text-secondary);
      box-shadow: none;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      padding: 0.4rem 0.9rem;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all var(--transition-normal);
    }

    .status-badge.ready {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fde68a;
    }

    .status-badge.ready .indicator-dot {
      background-color: var(--status-amber);
      box-shadow: 0 0 10px var(--status-amber-glow);
    }

    .status-badge.active {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.4);
      color: #a7f3d0;
    }

    .status-badge.active .indicator-dot {
      background-color: var(--status-emerald);
      box-shadow: 0 0 10px var(--status-emerald-glow);
    }

    .status-badge.danger {
      background: rgba(244, 63, 94, 0.15);
      border-color: rgba(244, 63, 94, 0.45);
      color: #fecdd3;
    }

    .status-badge.danger .indicator-dot {
      background-color: var(--status-crimson);
      box-shadow: 0 0 12px var(--status-crimson-glow);
      animation: pulse-danger 0.7s infinite alternate ease-in-out;
    }

    .indicator-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      animation: pulse-ambient 2s infinite ease-in-out;
    }

    @keyframes pulse-ambient {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    @keyframes pulse-danger {
      0% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.3; transform: scale(0.7); }
    }

    /* ==========================================================================
       4. TELEMETRY STRIP (4-CARD BALANCED HUD)
       ========================================================================== */
    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }

    .telemetry-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      backdrop-filter: blur(8px);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      position: relative;
      overflow: hidden;
    }

    .telemetry-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.4), transparent);
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .telemetry-card:hover {
      border-color: var(--border-hud);
      box-shadow: 0 4px 16px rgba(0, 240, 255, 0.08);
    }

    .telemetry-card:hover::before {
      opacity: 1;
    }

    .telemetry-card.highlight-gold {
      border-color: rgba(251, 191, 36, 0.25);
    }

    .telemetry-card.highlight-gold:hover {
      border-color: var(--neon-gold);
      box-shadow: 0 4px 16px rgba(251, 191, 36, 0.12);
    }

    .telemetry-label {
      font-size: 0.64rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }

    .telemetry-value {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan-glow);
      letter-spacing: 0.06em;
    }

    .telemetry-value.gold {
      color: var(--neon-gold);
      text-shadow: 0 0 10px var(--neon-gold-glow);
    }

    /* ==========================================================================
       5. CHASSIS BEZEL & CANVAS VIEWPORT
       ========================================================================== */
    .chassis-frame {
      position: relative;
      background: #020308;
      border: 1px solid var(--border-hud);
      border-radius: 10px;
      padding: 3px;
      box-shadow: 
        0 12px 40px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(0, 240, 255, 0.12),
        inset 0 0 30px rgba(6, 9, 24, 0.9);
      overflow: hidden;
      aspect-ratio: 4 / 3;
      max-height: 560px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chassis-frame::before,
    .chassis-frame::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      z-index: 5;
    }

    .chassis-frame::before {
      top: 6px;
      left: 6px;
      border-top: 2px solid var(--neon-cyan);
      border-left: 2px solid var(--neon-cyan);
    }

    .chassis-frame::after {
      bottom: 6px;
      right: 6px;
      border-bottom: 2px solid var(--neon-cyan);
      border-right: 2px solid var(--neon-cyan);
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #03040b;
      border-radius: 7px;
    }

    /* ==========================================================================
       6. INTERFACE ACTIONS & ACCESSIBLE BUTTONS
       ========================================================================== */
    .action-zone {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }

    .btn-tactical {
      position: relative;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.18) 0%, rgba(139, 92, 246, 0.28) 100%);
      border: 1px solid var(--neon-cyan);
      border-radius: 6px;
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.85rem 2.6rem;
      cursor: pointer;
      overflow: hidden;
      transition: all var(--transition-fast);
      box-shadow: 0 0 16px var(--neon-cyan-glow);
      outline: none;
    }

    .btn-tactical:focus-visible {
      outline: 2px solid var(--neon-cyan);
      outline-offset: 4px;
    }

    .btn-tactical:hover {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.35) 0%, rgba(139, 92, 246, 0.45) 100%);
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.65);
      border-color: #ffffff;
    }

    .btn-tactical:active {
      transform: translateY(1px);
      box-shadow: 0 0 10px var(--neon-cyan-glow);
    }

    .btn-tactical.active-flight {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(0, 240, 255, 0.25) 100%);
      border-color: var(--status-emerald);
      box-shadow: 0 0 18px var(--status-emerald-glow);
      cursor: default;
    }

    .btn-tactical.active-flight:hover {
      transform: none;
      box-shadow: 0 0 18px var(--status-emerald-glow);
    }

    .btn-tactical.btn-restart {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.3) 0%, rgba(139, 92, 246, 0.35) 100%);
      border-color: var(--status-crimson);
      box-shadow: 0 0 16px var(--status-crimson-glow);
    }

    .btn-tactical.btn-restart:hover {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.5) 0%, rgba(139, 92, 246, 0.55) 100%);
      border-color: #ffffff;
      box-shadow: 0 0 26px rgba(244, 63, 94, 0.8);
      transform: translateY(-2px);
    }

    .btn-tactical.btn-restart:focus-visible {
      outline: 2px solid var(--status-crimson);
      outline-offset: 4px;
    }

    .hidden {
      display: none !important;
    }

    /* ==========================================================================
       7. MISSION BRIEFING & CONTROLS FOOTER
       ========================================================================== */
    .briefing-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.85rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      backdrop-filter: blur(10px);
    }

    .briefing-header {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--neon-cyan);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .briefing-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(0, 240, 255, 0.3), transparent);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .key-badge {
      display: inline-block;
      padding: 0.2rem 0.45rem;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 4px;
      color: var(--neon-cyan);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      box-shadow: 0 0 6px rgba(0, 240, 255, 0.15);
    }

    /* ==========================================================================
       8. RESPONSIVE MEDIA BREAKPOINTS
       ========================================================================== */
    @media (max-width: 680px) {
      .brand-title {
        font-size: 1.35rem;
      }

      .telemetry-grid {
        grid-template-columns: 1fr 1fr;
      }

      .btn-tactical {
        width: 100%;
        padding: 0.8rem 1rem;
      }

      .controls-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Main Game Shell -->
  <main class="game-shell" role="main">

    <!-- Top Tactical Header & Controls -->
    <header class="tactical-header">
      <div class="brand-block">
        <h1 class="brand-title">Quantum Rift</h1>
        <span class="brand-protocol">Protocol // Tactical Cosmic Survival</span>
      </div>

      <div class="header-controls">
        <!-- Accessible Mute / Unmute Toggle Button -->
        <button id="soundToggleBtn" class="sound-toggle-btn" type="button" aria-label="Toggle Sound Effects">
          <span id="soundIcon" aria-hidden="true">🔊</span>
          <span id="soundToggleText">AUDIO: ON</span>
        </button>

        <div class="status-badge ready" id="statusContainer" aria-label="System Status">
          <span class="indicator-dot"></span>
          <span id="systemStatusText">DOCKING BAY // READY</span>
        </div>
      </div>
    </header>

    <!-- 4-Card Telemetry Strip -->
    <section class="telemetry-grid" aria-label="Flight Telemetry and Scoring">
      <div class="telemetry-card">
        <span class="telemetry-label">Current Score</span>
        <span class="telemetry-value" id="scoreDisplay">00000</span>
      </div>
      <div class="telemetry-card highlight-gold">
        <span class="telemetry-label">Best Record</span>
        <span class="telemetry-value gold" id="bestScoreDisplay">00000</span>
      </div>
      <div class="telemetry-card">
        <span class="telemetry-label">Rift Intensity</span>
        <span class="telemetry-value" id="intensityDisplay">100% INT</span>
      </div>
      <div class="telemetry-card">
        <span class="telemetry-label">Active Hazards</span>
        <span class="telemetry-value" id="hazardDisplay">00 AST</span>
      </div>
    </section>

    <!-- Canvas Chassis Viewport -->
    <div class="chassis-frame">
      <canvas id="gameCanvas" width="800" height="600" aria-label="Quantum Rift Tactical Radar"></canvas>
    </div>

    <!-- Action Bar & Controls -->
    <div class="action-zone">
      <button id="startButton" class="btn-tactical" type="button">Start Mission</button>
      <button id="restartButton" class="btn-tactical btn-restart hidden" type="button">Restart Mission</button>
    </div>

    <!-- Flight Manual & Controls Legend -->
    <footer class="briefing-card">
      <div class="briefing-header">Tactical Controls</div>
      <div class="controls-grid">
        <div class="control-item">
          <span class="key-badge">W A S D</span> or <span class="key-badge">&uarr; &larr; &darr; &rarr;</span>
          <span>Ion Thrusters (8-Way Vector)</span>
        </div>
        <div class="control-item">
          <span class="key-badge">Space</span>
          <span>Engage Launch / Restart</span>
        </div>
        <div class="control-item">
          <span class="key-badge">Mission</span>
          <span>Evade Asteroids & Survive</span>
        </div>
      </div>
    </footer>

  </main>

  <!-- ==========================================================================
       JAVASCRIPT: ENGINE, WEB AUDIO SYNTHESIZER & GAMEPLAY PIPELINE
       ========================================================================== -->
  <script>
    (function () {
      'use strict';

      // ========================================================================
      // SECTION 1: DOM REFERENCES & CANVAS 2D CONTEXT
      // ========================================================================
      const canvas = document.getElementById('gameCanvas');
      const startButton = document.getElementById('startButton');
      const restartButton = document.getElementById('restartButton');
      const statusContainer = document.getElementById('statusContainer');
      const systemStatusText = document.getElementById('systemStatusText');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const bestScoreDisplay = document.getElementById('bestScoreDisplay');
      const intensityDisplay = document.getElementById('intensityDisplay');
      const hazardDisplay = document.getElementById('hazardDisplay');
      const soundToggleBtn = document.getElementById('soundToggleBtn');
      const soundIcon = document.getElementById('soundIcon');
      const soundToggleText = document.getElementById('soundToggleText');

      if (!canvas || !canvas.getContext) {
        console.error('Critical Error: Canvas 2D API is unsupported on this browser.');
        return;
      }
      const ctx = canvas.getContext('2d');

      // ========================================================================
      // SECTION 2: CENTRALIZED GAME CONFIGURATION
      // ========================================================================
      const GAME_CONFIG = {
        SCORE_PER_SECOND: 10,             // Passive points earned per second of survival
        INITIAL_ASTEROID_SPEED: 120,      // Minimum starting asteroid speed (px/s)
        MAX_ASTEROID_SPEED: 320,          // Maximum capped asteroid speed (px/s)
        INITIAL_SPAWN_INTERVAL: 1.8,      // Starting delay between asteroid spawns (seconds)
        MIN_SPAWN_INTERVAL: 0.65,         // Fastest allowed spawn interval (seconds)
        MAX_ACTIVE_ASTEROIDS: 10,         // Maximum concurrent hazards allowed on screen
        DIFFICULTY_RAMP_TIME: 80,         // Seconds to reach 100% difficulty cap
        STORAGE_KEY: 'quantumRiftBestScore' // LocalStorage key for persistent high score
      };

      // ========================================================================
      // SECTION 3: WEB AUDIO API SYNTHESIZER (ZERO EXTERNAL ASSETS)
      // ========================================================================
      let audioCtx = null;
      let isMuted = false;

      /**
       * Safely initializes or resumes the singleton AudioContext upon user gesture.
       * Handles browser autoplay policy restrictions gracefully.
       */
      function getAudioContext() {
        try {
          if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContextClass();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          return audioCtx;
        } catch (err) {
          console.warn('[Quantum Rift Audio] Web Audio API initialization blocked:', err);
          return null;
        }
      }

      /**
       * Plays a pleasant two-tone melodic chime when reaching scoring milestones (every 100 points).
       */
      function playMilestoneSound() {
        if (isMuted) return;
        const actx = getAudioContext();
        if (!actx) return;

        try {
          const now = actx.currentTime;

          // Note 1: E5 (659.25 Hz)
          const osc1 = actx.createOscillator();
          const gain1 = actx.createGain();
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(659.25, now);
          
          gain1.gain.setValueAtTime(0.001, now);
          gain1.gain.exponentialRampToValueAtTime(0.08, now + 0.02);
          gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

          osc1.connect(gain1);
          gain1.connect(actx.destination);
          osc1.start(now);
          osc1.stop(now + 0.18);

          // Note 2: B5 (987.77 Hz) - harmonic fifth
          const osc2 = actx.createOscillator();
          const gain2 = actx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(987.77, now + 0.08);

          gain2.gain.setValueAtTime(0.001, now + 0.08);
          gain2.gain.exponentialRampToValueAtTime(0.09, now + 0.11);
          gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);

          osc2.connect(gain2);
          gain2.connect(actx.destination);
          osc2.start(now + 0.08);
          osc2.stop(now + 0.35);
        } catch (e) {
          // Fail silently without disrupting gameplay
        }
      }

      /**
       * Plays a deep, muffled sci-fi hull breach explosion on fatal collision.
       */
      function playCollisionSound() {
        if (isMuted) return;
        const actx = getAudioContext();
        if (!actx) return;

        try {
          const now = actx.currentTime;

          // Descending pitch oscillator (simulates kinetic hull collapse)
          const osc = actx.createOscillator();
          const filter = actx.createBiquadFilter();
          const gain = actx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(28, now + 0.45);

          // Low-pass filter to give a heavy, cosmic explosion timbre
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(500, now);
          filter.frequency.exponentialRampToValueAtTime(80, now + 0.45);

          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.48);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(actx.destination);

          osc.start(now);
          osc.stop(now + 0.5);

          // Sub-bass thump for physical impact feel
          const subOsc = actx.createOscillator();
          const subGain = actx.createGain();
          subOsc.type = 'sine';
          subOsc.frequency.setValueAtTime(80, now);
          subOsc.frequency.exponentialRampToValueAtTime(20, now + 0.35);

          subGain.gain.setValueAtTime(0.25, now);
          subGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.38);

          subOsc.connect(subGain);
          subGain.connect(actx.destination);

          subOsc.start(now);
          subOsc.stop(now + 0.4);
        } catch (e) {
          // Fail silently
        }
      }

      // Audio Toggle Click Handler
      soundToggleBtn.addEventListener('click', function () {
        getAudioContext(); // Initialize context upon click if suspended
        isMuted = !isMuted;

        if (isMuted) {
          soundToggleBtn.classList.add('muted');
          soundIcon.textContent = '🔇';
          soundToggleText.textContent = 'AUDIO: OFF';
        } else {
          soundToggleBtn.classList.remove('muted');
          soundIcon.textContent = '🔊';
          soundToggleText.textContent = 'AUDIO: ON';
        }
      });

      // ========================================================================
      // SECTION 4: PERSISTENT HIGH-SCORE SYSTEM (LOCALSTORAGE)
      // ========================================================================
      function loadBestScore() {
        try {
          const rawValue = localStorage.getItem(GAME_CONFIG.STORAGE_KEY);
          if (rawValue === null || rawValue === undefined || rawValue.trim() === '') {
            return 0;
          }
          const parsed = Number(rawValue);
          if (Number.isFinite(parsed) && parsed >= 0) {
            return Math.floor(parsed);
          }
          console.warn('[Quantum Rift] Invalid stored best score. Resetting to 0.');
          return 0;
        } catch (err) {
          console.warn('[Quantum Rift] Unable to access localStorage:', err);
          return 0;
        }
      }

      function saveBestScore() {
        const currentIntScore = Math.floor(score);
        if (currentIntScore > bestScore) {
          bestScore = currentIntScore;
          bestScoreDisplay.textContent = bestScore.toString().padStart(5, '0');
          try {
            localStorage.setItem(GAME_CONFIG.STORAGE_KEY, bestScore.toString());
          } catch (err) {
            console.warn('[Quantum Rift] Failed to save best score to localStorage:', err);
          }
        }
      }

      let bestScore = loadBestScore();
      bestScoreDisplay.textContent = bestScore.toString().padStart(5, '0');

      // ========================================================================
      // SECTION 5: CENTRALIZED GAME STATES
      // ========================================================================
      const GAME_STATES = {
        READY: 'READY',
        PLAYING: 'PLAYING',
        GAME_OVER: 'GAME_OVER'
      };

      let gameState = GAME_STATES.READY;

      let animationFrameId = null;
      let isLoopRunning = false;
      let lastTimestamp = 0;

      // Scoring & difficulty metrics
      let score = 0;
      let lastDisplayedScore = -1;
      let lastMilestoneEarned = 0;       // Tracks 100-point audio milestone increments
      let survivalTime = 0;
      let asteroidSpawnTimer = 0;

      // Visual feedback
      let screenShakeTime = 0;
      let collisionFlash = 0;

      // ========================================================================
      // SECTION 6: PLAYER OBJECT (HITBOX PRESERVED)
      // ========================================================================
      const player = {
        x: canvas.width / 2,
        y: canvas.height * 0.78,
        width: 38,
        height: 48,
        speed: 380, // Pixels per second
        vx: 0,
        vy: 0,
        tilt: 0,
        colorHull: '#00f0ff',
        colorWing: '#8b5cf6',
        glowCyan: 'rgba(0, 240, 255, 0.75)',
        glowPurple: 'rgba(139, 92, 246, 0.6)'
      };

      const halfWidth = player.width / 2;
      const halfHeight = player.height / 2;

      // ========================================================================
      // SECTION 7: ASTEROID GENERATION (HITBOXES PRESERVED)
      // ========================================================================
      const asteroids = [];

      function createAsteroid(difficultyFactor) {
        const size = Math.floor(Math.random() * 26) + 32; // 32px to 58px
        const radius = size / 2;

        const vertexCount = Math.floor(Math.random() * 3) + 7;
        const vertices = [];
        const angleStep = (Math.PI * 2) / vertexCount;

        for (let i = 0; i < vertexCount; i++) {
          const angle = i * angleStep;
          const r = radius * (0.75 + Math.random() * 0.5);
          vertices.push({
            x: Math.cos(angle) * r,
            y: Math.sin(angle) * r
          });
        }

        const margin = radius + 10;
        const x = Math.random() * (canvas.width - margin * 2) + margin;

        const baseSpeed = GAME_CONFIG.INITIAL_ASTEROID_SPEED + 
          (GAME_CONFIG.MAX_ASTEROID_SPEED - GAME_CONFIG.INITIAL_ASTEROID_SPEED) * difficultyFactor;
        
        const speedWithVariance = baseSpeed + (Math.random() * 50 - 25);
        const finalSpeed = Math.min(GAME_CONFIG.MAX_ASTEROID_SPEED, Math.max(GAME_CONFIG.INITIAL_ASTEROID_SPEED, speedWithVariance));

        return {
          x: x,
          y: -size,
          width: size,
          height: size,
          speed: finalSpeed,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 1.8,
          vertices: vertices
        };
      }

      // ========================================================================
      // SECTION 8: MULTI-LAYER STARFIELD
      // ========================================================================
      const stars = [];
      const STAR_LAYERS = [
        { count: 45, minSpeed: 15, maxSpeed: 30, minR: 0.6, maxR: 1.0, alpha: 0.35, color: '#94a3b8' },
        { count: 30, minSpeed: 45, maxSpeed: 75, minR: 1.2, maxR: 1.6, alpha: 0.65, color: '#c084fc' },
        { count: 12, minSpeed: 95, maxSpeed: 160, minR: 1.8, maxR: 2.2, alpha: 0.95, color: '#38bdf8' }
      ];

      for (let layer of STAR_LAYERS) {
        for (let i = 0; i < layer.count; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * (layer.maxR - layer.minR) + layer.minR,
            speed: Math.random() * (layer.maxSpeed - layer.minSpeed) + layer.minSpeed,
            alpha: layer.alpha,
            color: layer.color
          });
        }
      }

      // ========================================================================
      // SECTION 9: INPUT MANAGEMENT
      // ========================================================================
      const pressedKeys = new Set();

      const GAME_KEYS = new Set([
        'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
        'KeyW', 'KeyS', 'KeyA', 'KeyD',
        'Space'
      ]);

      window.addEventListener('keydown', function (e) {
        if (GAME_KEYS.has(e.code)) {
          e.preventDefault();
        }

        // Resume AudioContext on key interaction
        getAudioContext();

        if (e.code === 'Space') {
          if (gameState === GAME_STATES.READY) {
            startGame();
            return;
          } else if (gameState === GAME_STATES.GAME_OVER) {
            restartGame();
            return;
          }
        }

        if (gameState === GAME_STATES.PLAYING) {
          pressedKeys.add(e.code);
        }
      });

      window.addEventListener('keyup', function (e) {
        if (GAME_KEYS.has(e.code)) {
          e.preventDefault();
        }
        pressedKeys.delete(e.code);
      });

      window.addEventListener('blur', function () {
        pressedKeys.clear();
      });

      window.addEventListener('focus', function () {
        pressedKeys.clear();
        lastTimestamp = performance.now();
      });

      // ========================================================================
      // SECTION 10: AABB COLLISION DETECTION
      // ========================================================================
      function checkCollision(player, asteroid) {
        const playerLeft = player.x - player.width / 2;
        const playerRight = player.x + player.width / 2;
        const playerTop = player.y - player.height / 2;
        const playerBottom = player.y + player.height / 2;

        const asteroidLeft = asteroid.x - asteroid.width / 2;
        const asteroidRight = asteroid.x + asteroid.width / 2;
        const asteroidTop = asteroid.y - asteroid.height / 2;
        const asteroidBottom = asteroid.y + asteroid.height / 2;

        return (
          playerRight > asteroidLeft &&
          playerLeft < asteroidRight &&
          playerBottom > asteroidTop &&
          playerTop < asteroidBottom
        );
      }

      function checkAllCollisions() {
        if (gameState !== GAME_STATES.PLAYING) return;

        for (let i = 0; i < asteroids.length; i++) {
          if (checkCollision(player, asteroids[i])) {
            endGame();
            break;
          }
        }
      }

      // ========================================================================
      // SECTION 11: STATE TRANSITIONS (START, RESTART, END)
      // ========================================================================
      function startGame() {
        if (gameState !== GAME_STATES.READY) return;

        getAudioContext();
        gameState = GAME_STATES.PLAYING;

        statusContainer.classList.remove('ready', 'danger');
        statusContainer.classList.add('active');
        systemStatusText.textContent = 'SYSTEM ENGAGED // RIFT FLIGHT';
        startButton.textContent = 'THRUSTERS ENGAGED';
        startButton.classList.add('active-flight');
        restartButton.classList.add('hidden');

        lastTimestamp = performance.now();
        startLoop();
      }

      function restartGame() {
        getAudioContext();
        gameState = GAME_STATES.PLAYING;

        score = 0;
        lastDisplayedScore = -1;
        lastMilestoneEarned = 0;
        survivalTime = 0;
        asteroidSpawnTimer = 0;
        screenShakeTime = 0;
        collisionFlash = 0;

        asteroids.length = 0;

        player.x = canvas.width / 2;
        player.y = canvas.height * 0.78;
        player.vx = 0;
        player.vy = 0;
        player.tilt = 0;

        pressedKeys.clear();

        scoreDisplay.textContent = '00000';
        bestScoreDisplay.textContent = bestScore.toString().padStart(5, '0');
        intensityDisplay.textContent = '100% INT';
        hazardDisplay.textContent = '00 AST';

        statusContainer.classList.remove('ready', 'danger');
        statusContainer.classList.add('active');
        systemStatusText.textContent = 'SYSTEM ENGAGED // RIFT FLIGHT';

        startButton.textContent = 'THRUSTERS ENGAGED';
        startButton.classList.remove('hidden');
        startButton.classList.add('active-flight');
        restartButton.classList.add('hidden');

        lastTimestamp = performance.now();
        startLoop();
      }

      function endGame() {
        gameState = GAME_STATES.GAME_OVER;

        pressedKeys.clear();
        player.vx = 0;
        player.vy = 0;
        player.tilt = 0;

        // Visual and Audio Collision Feedback
        screenShakeTime = 0.35;
        collisionFlash = 0.8;
        playCollisionSound();

        saveBestScore();

        statusContainer.classList.remove('ready', 'active');
        statusContainer.classList.add('danger');
        systemStatusText.textContent = 'CRITICAL FAILURE // HULL BREACHED';

        startButton.classList.add('hidden');
        startButton.classList.remove('active-flight');
        restartButton.classList.remove('hidden');
      }

      startButton.addEventListener('click', startGame);
      restartButton.addEventListener('click', restartGame);

      // ========================================================================
      // SECTION 12: updateGame(deltaTime) — SIMULATION, SCORING & AUDIO HOOKS
      // ========================================================================
      function updateGame(deltaTime) {
        // --- 12A. Starfield Update ---
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          s.y += s.speed * deltaTime;
          if (s.y > canvas.height) {
            s.y = 0;
            s.x = Math.random() * canvas.width;
          }
        }

        // --- 12B. Visual Feedback Timers ---
        if (screenShakeTime > 0) {
          screenShakeTime = Math.max(0, screenShakeTime - deltaTime);
        }
        if (collisionFlash > 0) {
          collisionFlash = Math.max(0, collisionFlash - deltaTime * 2.2);
        }

        // --- 12C. Strict State Guard ---
        if (gameState !== GAME_STATES.PLAYING) {
          player.vx = 0;
          player.vy = 0;
          player.tilt = 0;
          return;
        }

        // --- 12D. Scoring, Best Score & 100-Point Milestone Audio ---
        survivalTime += deltaTime;
        score += GAME_CONFIG.SCORE_PER_SECOND * deltaTime;

        const currentIntScore = Math.floor(score);
        if (currentIntScore !== lastDisplayedScore) {
          lastDisplayedScore = currentIntScore;
          scoreDisplay.textContent = currentIntScore.toString().padStart(5, '0');
          saveBestScore();

          // Audio hook: trigger melodic chime every 100 points
          const currentMilestone = Math.floor(currentIntScore / 100);
          if (currentMilestone > lastMilestoneEarned) {
            lastMilestoneEarned = currentMilestone;
            playMilestoneSound();
          }
        }

        // --- 12E. Progressive Difficulty ---
        const difficultyFactor = Math.min(1.0, survivalTime / GAME_CONFIG.DIFFICULTY_RAMP_TIME);
        const intensityPercent = Math.round(100 + difficultyFactor * 150);
        intensityDisplay.textContent = `${intensityPercent}% INT`;

        const currentSpawnInterval = GAME_CONFIG.INITIAL_SPAWN_INTERVAL - 
          (GAME_CONFIG.INITIAL_SPAWN_INTERVAL - GAME_CONFIG.MIN_SPAWN_INTERVAL) * difficultyFactor;

        // --- 12F. Asteroids Management ---
        asteroidSpawnTimer += deltaTime;
        if (asteroidSpawnTimer >= currentSpawnInterval && asteroids.length < GAME_CONFIG.MAX_ACTIVE_ASTEROIDS) {
          asteroids.push(createAsteroid(difficultyFactor));
          asteroidSpawnTimer = 0;
        }

        for (let i = 0; i < asteroids.length; i++) {
          const ast = asteroids[i];
          ast.y += ast.speed * deltaTime;
          ast.rotation += ast.rotationSpeed * deltaTime;
        }

        for (let i = asteroids.length - 1; i >= 0; i--) {
          if (asteroids[i].y - asteroids[i].height > canvas.height) {
            asteroids.splice(i, 1);
          }
        }

        hazardDisplay.textContent = `${asteroids.length.toString().padStart(2, '0')} AST`;

        // --- 12G. Player Flight Controls ---
        let inputX = 0;
        let inputY = 0;

        if (pressedKeys.has('KeyW') || pressedKeys.has('ArrowUp')) inputY -= 1;
        if (pressedKeys.has('KeyS') || pressedKeys.has('ArrowDown')) inputY += 1;
        if (pressedKeys.has('KeyA') || pressedKeys.has('ArrowLeft')) inputX -= 1;
        if (pressedKeys.has('KeyD') || pressedKeys.has('ArrowRight')) inputX += 1;

        if (inputX !== 0 && inputY !== 0) {
          const invLen = 1 / Math.SQRT2;
          inputX *= invLen;
          inputY *= invLen;
        }

        player.vx = inputX * player.speed;
        player.vy = inputY * player.speed;

        player.x += player.vx * deltaTime;
        player.y += player.vy * deltaTime;

        player.x = Math.max(halfWidth, Math.min(canvas.width - halfWidth, player.x));
        player.y = Math.max(halfHeight, Math.min(canvas.height - halfHeight, player.y));

        const targetTilt = inputX !== 0 ? Math.sign(inputX) * 0.45 : 0;
        player.tilt += (targetTilt - player.tilt) * 12 * deltaTime;

        // --- 12H. Collision Evaluation ---
        checkAllCollisions();
      }

      // ========================================================================
      // SECTION 13: renderGame() — VISUAL CANVAS RENDERING
      // ========================================================================
      function renderGame() {
        ctx.save();

        if (screenShakeTime > 0) {
          const intensity = (screenShakeTime / 0.35) * 5;
          const offsetX = (Math.random() - 0.5) * intensity;
          const offsetY = (Math.random() - 0.5) * intensity;
          ctx.translate(offsetX, offsetY);
        }

        ctx.fillStyle = '#03040b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Cosmic nebula gradient
        const nebulaGrad = ctx.createRadialGradient(canvas.width * 0.5, 0, 10, canvas.width * 0.5, 0, canvas.width * 0.7);
        nebulaGrad.addColorStop(0, 'rgba(139, 92, 246, 0.08)');
        nebulaGrad.addColorStop(0.5, 'rgba(0, 240, 255, 0.03)');
        nebulaGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = nebulaGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Parallax Starfield
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fillStyle = s.color;
          ctx.globalAlpha = s.alpha;
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // Asteroids
        for (let i = 0; i < asteroids.length; i++) {
          const ast = asteroids[i];
          ctx.save();
          ctx.translate(ast.x, ast.y);
          ctx.rotate(ast.rotation);

          ctx.shadowColor = 'rgba(139, 92, 246, 0.35)';
          ctx.shadowBlur = 6;

          ctx.beginPath();
          ctx.moveTo(ast.vertices[0].x, ast.vertices[0].y);
          for (let v = 1; v < ast.vertices.length; v++) {
            ctx.lineTo(ast.vertices[v].x, ast.vertices[v].y);
          }
          ctx.closePath();

          const rockGrad = ctx.createLinearGradient(-ast.width / 2, -ast.height / 2, ast.width / 2, ast.height / 2);
          rockGrad.addColorStop(0, '#1c172d');
          rockGrad.addColorStop(0.7, '#100e1c');
          rockGrad.addColorStop(1, '#080710');
          ctx.fillStyle = rockGrad;
          ctx.fill();

          ctx.lineWidth = 1.8;
          ctx.strokeStyle = '#8b5cf6';
          ctx.stroke();

          // Interior crystalline fractures
          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.moveTo(ast.vertices[0].x, ast.vertices[0].y);
          ctx.lineTo(0, 0);
          ctx.lineTo(ast.vertices[Math.floor(ast.vertices.length / 2)].x, ast.vertices[Math.floor(ast.vertices.length / 2)].y);
          ctx.moveTo(0, 0);
          ctx.lineTo(ast.vertices[2].x, ast.vertices[2].y);
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // Surface crater highlight
          ctx.beginPath();
          ctx.arc(-ast.width * 0.15, -ast.height * 0.12, ast.width * 0.12, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(6, 6, 14, 0.8)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(139, 92, 246, 0.25)';
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.restore();
        }

        // Spacecraft
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.tilt * 0.2);

        const isPlaying = (gameState === GAME_STATES.PLAYING);
        const isThrusting = isPlaying && (player.vx !== 0 || player.vy !== 0);
        const isDestroyed = (gameState === GAME_STATES.GAME_OVER);

        const flameLength = isThrusting ? 20 + (Math.random() * 6) : (isPlaying ? 8 + Math.random() * 2 : 0);

        if (flameLength > 0) {
          const leftPlume = ctx.createLinearGradient(-10, halfHeight - 6, -10, halfHeight + flameLength);
          leftPlume.addColorStop(0, '#ffffff');
          leftPlume.addColorStop(0.3, '#00f0ff');
          leftPlume.addColorStop(1, 'rgba(139, 92, 246, 0)');
          
          ctx.beginPath();
          ctx.moveTo(-10, halfHeight - 6);
          ctx.lineTo(-14, halfHeight + flameLength);
          ctx.lineTo(-6, halfHeight - 6);
          ctx.fillStyle = leftPlume;
          ctx.shadowColor = 'rgba(0, 240, 255, 0.85)';
          ctx.shadowBlur = 12;
          ctx.fill();

          const rightPlume = ctx.createLinearGradient(10, halfHeight - 6, 10, halfHeight + flameLength);
          rightPlume.addColorStop(0, '#ffffff');
          rightPlume.addColorStop(0.3, '#00f0ff');
          rightPlume.addColorStop(1, 'rgba(139, 92, 246, 0)');

          ctx.beginPath();
          ctx.moveTo(10, halfHeight - 6);
          ctx.lineTo(14, halfHeight + flameLength);
          ctx.lineTo(6, halfHeight - 6);
          ctx.fillStyle = rightPlume;
          ctx.fill();
        }

        ctx.shadowColor = isDestroyed ? 'rgba(244, 63, 94, 0.9)' : player.glowCyan;
        ctx.shadowBlur = isDestroyed ? 16 : 12;

        ctx.beginPath();
        ctx.moveTo(0, -halfHeight);
        ctx.lineTo(halfWidth, halfHeight - 4);
        ctx.lineTo(halfWidth - 8, halfHeight);
        ctx.lineTo(0, halfHeight - 7);
        ctx.lineTo(-halfWidth + 8, halfHeight);
        ctx.lineTo(-halfWidth, halfHeight - 4);
        ctx.closePath();

        const hullGrad = ctx.createLinearGradient(0, -halfHeight, 0, halfHeight);
        hullGrad.addColorStop(0, '#10172e');
        hullGrad.addColorStop(1, '#080b18');
        ctx.fillStyle = hullGrad;
        ctx.fill();

        ctx.lineWidth = 1.8;
        ctx.strokeStyle = isDestroyed ? '#f43f5e' : player.colorHull;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, -halfHeight + 11);
        ctx.lineTo(halfWidth - 10, halfHeight - 6);
        ctx.lineTo(0, halfHeight - 11);
        ctx.lineTo(-halfWidth + 10, halfHeight - 6);
        ctx.closePath();
        ctx.strokeStyle = isDestroyed ? '#9f1239' : player.colorWing;
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.shadowColor = isDestroyed ? 'rgba(244, 63, 94, 0.9)' : 'rgba(0, 240, 255, 0.95)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.ellipse(0, -halfHeight + 17, 4.5, 9, 0, 0, Math.PI * 2);
        
        const canopyGrad = ctx.createLinearGradient(0, -halfHeight + 8, 0, -halfHeight + 26);
        canopyGrad.addColorStop(0, '#ffffff');
        canopyGrad.addColorStop(1, isDestroyed ? '#f43f5e' : '#0284c7');
        ctx.fillStyle = canopyGrad;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(-halfWidth + 2, halfHeight - 4, 1.6, 0, Math.PI * 2);
        ctx.fillStyle = isDestroyed ? '#f43f5e' : '#f43f5e';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(halfWidth - 2, halfHeight - 4, 1.6, 0, Math.PI * 2);
        ctx.fillStyle = isDestroyed ? '#f43f5e' : '#10b981';
        ctx.fill();

        ctx.restore();

        if (collisionFlash > 0) {
          ctx.fillStyle = `rgba(244, 63, 94, ${collisionFlash * 0.35})`;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // --- 13A. READY Overlay ---
        if (gameState === GAME_STATES.READY) {
          ctx.save();
          ctx.fillStyle = 'rgba(3, 5, 12, 0.72)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(canvas.width / 2, canvas.height / 2, 75, 0, Math.PI * 2);
          ctx.stroke();

          ctx.font = '900 36px var(--font-display)';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(0, 240, 255, 0.85)';
          ctx.shadowBlur = 18;
          ctx.fillText('QUANTUM RIFT', canvas.width / 2, canvas.height / 2 - 60);

          ctx.font = 'bold 13px var(--font-mono)';
          ctx.fillStyle = '#00f0ff';
          ctx.shadowBlur = 8;
          ctx.letterSpacing = '0.2em';
          ctx.fillText('MISSION PROTOCOL: COSMIC SURVIVAL', canvas.width / 2, canvas.height / 2 - 25);

          ctx.font = 'bold 15px var(--font-mono)';
          ctx.fillStyle = '#fbbf24';
          ctx.shadowColor = 'rgba(251, 191, 36, 0.65)';
          ctx.shadowBlur = 10;
          ctx.fillText(`ALL-TIME RECORD: ${bestScore.toString().padStart(5, '0')} PTS`, canvas.width / 2, canvas.height / 2 + 12);

          ctx.font = 'bold 14px var(--font-display)';
          ctx.fillStyle = '#a855f7';
          ctx.shadowColor = 'rgba(168, 85, 247, 0.7)';
          ctx.shadowBlur = 10;
          ctx.fillText('CLICK [START MISSION] OR PRESS [SPACEBAR] TO ENGAGE', canvas.width / 2, canvas.height / 2 + 52);

          ctx.font = '12px var(--font-mono)';
          ctx.fillStyle = '#94a3b8';
          ctx.shadowBlur = 0;
          ctx.fillText('STEER WITH WASD OR ARROW KEYS', canvas.width / 2, canvas.height / 2 + 82);

          ctx.restore();
        }

        // --- 13B. GAME_OVER Overlay ---
        if (gameState === GAME_STATES.GAME_OVER) {
          ctx.save();
          ctx.fillStyle = 'rgba(10, 3, 8, 0.84)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.font = '900 32px var(--font-display)';
          ctx.fillStyle = '#f43f5e';
          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(244, 63, 94, 0.85)';
          ctx.shadowBlur = 20;
          ctx.fillText('QUANTUM RIFT COLLAPSED', canvas.width / 2, canvas.height / 2 - 70);

          const finalIntScore = Math.floor(score);
          const isNewRecord = (finalIntScore === bestScore && finalIntScore > 0);

          if (isNewRecord) {
            ctx.font = 'bold 15px var(--font-display)';
            ctx.fillStyle = '#fbbf24';
            ctx.shadowColor = 'rgba(251, 191, 36, 0.85)';
            ctx.shadowBlur = 12;
            ctx.fillText('★ NEW ALL-TIME RECORD ACHIEVED! ★', canvas.width / 2, canvas.height / 2 - 35);
          }

          ctx.font = 'bold 24px var(--font-mono)';
          ctx.fillStyle = '#00f0ff';
          ctx.shadowColor = 'rgba(0, 240, 255, 0.8)';
          ctx.shadowBlur = 12;
          ctx.fillText(`FINAL SCORE: ${finalIntScore.toString().padStart(5, '0')}`, canvas.width / 2, canvas.height / 2 - 5);

          ctx.font = 'bold 18px var(--font-mono)';
          ctx.fillStyle = '#fbbf24';
          ctx.shadowColor = 'rgba(251, 191, 36, 0.6)';
          ctx.shadowBlur = 8;
          ctx.fillText(`BEST RECORD: ${bestScore.toString().padStart(5, '0')}`, canvas.width / 2, canvas.height / 2 + 25);

          ctx.font = '13px var(--font-mono)';
          ctx.fillStyle = '#cbd5e1';
          ctx.shadowBlur = 0;
          ctx.fillText(`SURVIVAL TIME: ${survivalTime.toFixed(1)} SECONDS`, canvas.width / 2, canvas.height / 2 + 52);

          ctx.font = 'bold 14px var(--font-display)';
          ctx.fillStyle = '#a855f7';
          ctx.shadowColor = 'rgba(168, 85, 247, 0.7)';
          ctx.shadowBlur = 10;
          ctx.letterSpacing = '0.08em';
          ctx.fillText('CLICK [RESTART MISSION] OR PRESS [SPACEBAR] TO RETRY', canvas.width / 2, canvas.height / 2 + 88);

          ctx.restore();
        }

        ctx.restore();
      }

      // ========================================================================
      // SECTION 14: gameLoop(timestamp) — MAIN ANIMATION LOOP
      // ========================================================================
      function gameLoop(currentTimestamp) {
        if (!lastTimestamp) {
          lastTimestamp = currentTimestamp;
        }

        const deltaTime = Math.min((currentTimestamp - lastTimestamp) / 1000, 0.1);
        lastTimestamp = currentTimestamp;

        updateGame(deltaTime);
        renderGame();

        animationFrameId = requestAnimationFrame(gameLoop);
      }

      function startLoop() {
        if (isLoopRunning) return;
        isLoopRunning = true;
        lastTimestamp = performance.now();
        animationFrameId = requestAnimationFrame(gameLoop);
      }

      startLoop();

    })();
  </script>
</body>
</html>
